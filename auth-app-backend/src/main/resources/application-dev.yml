
#development version of configurations

server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_app
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  logging:
    level:
      org.springframework.security: DEBUG









